[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
indi-link = { version = "0.1.0", path = "../indi-link", features = ["serde"] }
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[[bin]]
name = "indicontrol-engine"
path = "src/main.rs"
