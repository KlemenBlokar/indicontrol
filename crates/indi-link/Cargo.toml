[package]
name = "indi-link"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
indexmap = "2.14.2"
quick-xml = "0.42.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["net", "io-util", "sync", "rt", "macros", "time"], optional = true }
tracing = "0.1.44"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["client"]
# Async TCP client (native only).
client = ["dep:tokio", "quick-xml/async-tokio"]
serde = ["dep:serde", "indexmap/serde"]

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
