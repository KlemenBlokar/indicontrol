[package]
name = "indicontrol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.35.0", features = ["persistence"] }
ewebsock = "0.8.0"
indi-link = { version = "0.1.0", path = "../indi-link", default-features = false }
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }

# Native: can embed a local engine.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
engine = { version = "0.1.0", path = "../engine" }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Web: served by the engine, talks back to it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement"] }
